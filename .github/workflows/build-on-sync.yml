name: Build on Sync

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      create_release:
        description: '创建 GitHub Release'
        required: false
        type: boolean
        default: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    env:
      CI: false
      # 注意：如需启用自动更新签名，请在仓库 Secrets 中配置 TAURI_PRIVATE_KEY 和 TAURI_KEY_PASSWORD
      # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version info
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # 直接使用 package.json 中的版本号，不再追加编号后缀
          GIT_HASH=$(git rev-parse --short HEAD)
          GIT_DESC="v${VERSION}-${GIT_HASH}"
          # GitHub Actions 运行在 UTC 环境，手动加 8 小时
          BUILD_TIME=$(date -u -d '+8 hours' +'%Y-%m-%d %H:%M:%S UTC+8')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "git_desc=$GIT_DESC" >> $GITHUB_OUTPUT
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
          echo "file_prefix=EcoPaste-Pro_${VERSION}" >> $GITHUB_OUTPUT

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows app (x64)
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Rename artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe "dist/${{ steps.version.outputs.file_prefix }}_x64-setup.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-build
          path: dist/*.exe
          retention-days: 7
          compression-level: 0

      - name: Generate release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_TIME: ${{ steps.version.outputs.build_time }}
          GIT_DESC: ${{ steps.version.outputs.git_desc }}
        run: |
          node - <<'EOF'
          const fs = require("node:fs");

          const version = process.env.VERSION;
          const match = version.match(/Pro\.(\d+\.\d+)/);
          const heading = match ? `### Pro.${match[1]}` : null;

          let changelog = "";
          if (heading) {
            const lines = fs
              .readFileSync("docs/changelog.md", "utf-8")
              .split(/\r?\n/);
            const start = lines.findIndex((line) => line.trim() === heading);

            if (start !== -1) {
              let end = lines.length;
              for (let i = start + 1; i < lines.length; i += 1) {
                if (/^#{1,3}\s+/.test(lines[i])) {
                  end = i;
                  break;
                }
              }
              changelog = lines.slice(start + 1, end).join("\n").trim();
            }
          }

          const notes = `## EcoPaste-Pro 增强版

          ### 📋 版本信息
          - **版本**: ${version}
          - **构建时间**: ${process.env.BUILD_TIME}
          - **Git 描述**: ${process.env.GIT_DESC}

          ### 🆕 更新日志
          ${changelog || "- 暂无更新日志"}

          ### ⚠️ 注意事项
          - 此版本禁用了自动更新功能，避免与官方版本冲突
          - 配置文件与官方版本兼容，可直接替换使用
          `;

          fs.writeFileSync("release-notes.md", notes);
          EOF

      - name: Create Release
        if: github.event.inputs.create_release != 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "EcoPaste-Pro_v${{ steps.version.outputs.version }}"
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
